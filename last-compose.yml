#Definition des services laravel et postgres
services:
  laravel:
    build: . #Creer une image a partir du Dockerfile courant
    image: laravelapp
    entrypoint: /projet/entrypoint.sh
    restart: unless-stopped
    ports:
      - "7000:8000"
    depends_on:
      - postgres
  postgres:
    image: postgres:15
    volumes:
      - dbdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=ifnti
      - POSTGRES_DB=laraveldb
      - POSTGRES_PASSWORD=ifnti1234
volumes:
  dbdata:
