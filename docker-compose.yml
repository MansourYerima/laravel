#Definition des services laravel et postgres
services:
  laravel:
    build: . #Creer une image a partir du Dockerfile courant
    image: laravelapp
    entrypoint: ["/bin/bash", "/projet/entrypoint.sh"]
    restart: unless-stopped
    ports:
      - "7000:8000"
    volumes:
      - ./app:/projet
    depends_on:
      - postgres
  postgres:
    image: postgres:15
    volumes:
      - dbdata:/var/lib/postgresql/data
    env_file:
      - .env
          #environment:
      
      #- POSTGRES_USER=${DB_USERNAME}
      #- POSTGRES_DB=${DB_DATABASE}
      #- POSTGRES_PASSWORD=${DB_PASSWORD}
volumes:
  dbdata:
