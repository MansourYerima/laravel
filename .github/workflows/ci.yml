#Definir un nom
name: Laravel CI
#Definir les triggers
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      #Recuperer le code source
      - name: Recuperer le code source
        uses: actions/checkout@v5

      #Executer les tests
      - name: Run test
        run: cd app && composer install && cp .env.example .env && php artisan key:generate && php artisan test

      #Construire image
      - name: Construire image
        run: docker build -t manslunick/laravel:latest . 

      #Se connecter
      - name: Connexion a docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_TOKEN }}

      